[project]
name = "agromega-api"
version = "0.1.0"
description = "AgroMega news and adverts parser service"
requires-python = ">=3.14,<3.15"
dependencies = [
    "Authlib==1.7.2",
    "boto3>=1.40,<2",
    "celery[redis]>=5.6,<5.7",
    "Django==6.1",
    # Temporary exact upstream pin: merged Django 6.1 support, pending the next PyPI release.
    "django-celery-beat @ git+https://github.com/celery/django-celery-beat.git@8049336cf61c38a281244fba2431caf438e93b73",
    "django-ninja==1.6.3",
    "gunicorn==23.0.0",
    "lxml>=6,<7",
    "Markdown>=3.8,<4",
    "Pillow>=11,<13",
    "psycopg[c]==3.3.4",
    "requests==2.34.0",
    "scikit-learn>=1.7,<2",
    "stop-words==2018.7.23",
    "transliterate>=1.10,<2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-django>=4.11,<5",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["src"]
testpaths = ["src/tests"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
