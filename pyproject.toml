[project]
name = "agromega-api"
version = "0.1.0"
description = "AgroMega news and adverts parser service"
requires-python = ">=3.14,<3.15"
dependencies = [
    "Authlib==1.7.2",
    "Django==6.1",
    "django-ninja==1.6.3",
    "gunicorn==23.0.0",
    "psycopg[c]==3.3.4",
    "requests==2.34.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-django>=4.11,<5",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["src"]
testpaths = ["src/tests"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
