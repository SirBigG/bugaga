services:
  db:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  django:
    image: ${BUGAGA_DJANGO_IMAGE:-sirbigg/bugaga:django-latest}
    build:
      context: .
      dockerfile: Dockerfile.django
    env_file:
      - project.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      PYTHONPATH: /app/src
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8282:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - celery-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  celery-worker:
    image: ${BUGAGA_DJANGO_IMAGE:-sirbigg/bugaga:django-latest}
    build:
      context: .
      dockerfile: Dockerfile.django
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--pool=threads", "--concurrency=2"]
    env_file:
      - project.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      PYTHONPATH: /app/src
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    image: ${BUGAGA_DJANGO_IMAGE:-sirbigg/bugaga:django-latest}
    build:
      context: .
      dockerfile: Dockerfile.django
    command:
      [
        "celery",
        "-A",
        "config",
        "beat",
        "--loglevel=INFO",
        "--scheduler=django_celery_beat.schedulers:DatabaseScheduler",
      ]
    env_file:
      - project.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      PYTHONPATH: /app/src
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  celery-redis-data:
